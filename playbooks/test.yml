# code: language=ansible
---
- name: Install NUT for UPS management
  hosts: docker_server
  roles:
    - nut

- name: Test Wazuh password hash generation
  hosts: docker_server
  vars_files:
    - roles/wazuh/defaults/main.yml
  tasks:
    - name: Generate a disposable password for the Wazuh hash smoke test
      ansible.builtin.set_fact:
        wazuh_hash_test_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
      no_log: true
      tags:
        - wazuh_hash_test

    - name: Generate a Wazuh indexer password hash
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -i
          - "wazuh/wazuh-indexer:{{ wazuh_version }}"
          - bash
          - -c
          - >-
            IFS= read -r WAZUH_HASH_PASSWORD &&
            export WAZUH_HASH_PASSWORD &&
            exec /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh
            -env WAZUH_HASH_PASSWORD
        stdin: "{{ wazuh_hash_test_password }}"
      register: wazuh_hash_test_result
      changed_when: false
      failed_when: false
      no_log: true
      tags:
        - wazuh_hash_test

    - name: Extract the generated Wazuh password hash
      ansible.builtin.set_fact:
        wazuh_hash_test_extracted: >-
          {{
            wazuh_hash_test_result.stdout
            | regex_search('[$]2[aby][$][0-9]{2}[$][./A-Za-z0-9]{53}')
          }}
      no_log: true
      tags:
        - wazuh_hash_test

    - name: Verify the Wazuh indexer password hash was generated
      ansible.builtin.assert:
        that:
          - wazuh_hash_test_result.rc == 0
          - wazuh_hash_test_extracted is string
          - wazuh_hash_test_extracted | length == 60
        fail_msg: "Wazuh password hash smoke test failed."
      tags:
        - wazuh_hash_test
...
