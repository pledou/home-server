---
- name: Detect NVIDIA device presence on host
  ansible.builtin.stat:
    path: /dev/nvidiactl
  register: gpu_nvidia_device

- name: Check host NVIDIA driver availability
  ansible.builtin.command:
    cmd: nvidia-smi -L
  register: gpu_nvidia_smi_check
  changed_when: false
  failed_when: false
  when: gpu_nvidia_device.stat.exists | default(false)

- name: Try to recover NVIDIA runtime when driver appears unloaded
  become: "{{ not local_safe }}"
  when:
    - gpu_attempt_recovery | bool
    - gpu_nvidia_device.stat.exists | default(false)
    - (gpu_nvidia_smi_check.rc | default(1) | int) != 0
  block:
    - name: Load NVIDIA kernel module
      ansible.builtin.command:
        cmd: modprobe nvidia
      changed_when: false
      failed_when: false

    - name: Load NVIDIA UVM kernel module
      ansible.builtin.command:
        cmd: modprobe nvidia_uvm
      changed_when: false
      failed_when: false

    - name: Ensure nvidia-persistenced service is started
      ansible.builtin.service:
        name: nvidia-persistenced
        state: started
        enabled: true
      failed_when: false

    - name: Re-check NVIDIA driver availability
      ansible.builtin.command:
        cmd: nvidia-smi -L
      register: gpu_nvidia_smi_recheck
      changed_when: false
      failed_when: false


- name: Detect Intel GPU device presence
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: gpu_intel_render_device

- name: Compute effective GPU facts
  ansible.builtin.set_fact:
    gpu_nvidia_available: >-
      {{
        (gpu_nvidia_device.stat.exists | default(false))
        and ((gpu_nvidia_smi_recheck.rc | default(gpu_nvidia_smi_check.rc | default(1))) | int) == 0
      }}
    gpu_intel_available: "{{ gpu_intel_render_device.stat.exists | default(false) }}"
    gpu_mode_effective: >-
      {{
        'nvidia'
        if (
          (gpu_nvidia_device.stat.exists | default(false))
          and ((gpu_nvidia_smi_recheck.rc | default(gpu_nvidia_smi_check.rc | default(1))) | int) == 0
        )
        else ('intel' if (gpu_intel_render_device.stat.exists | default(false)) else 'none')
      }}

- name: Query NVIDIA GPU memory and PCIe link
  ansible.builtin.command:
    cmd: >-
      nvidia-smi --id={{ gpu_nvidia_index }}
      --query-gpu=memory.total,memory.free,pcie.link.width.current,pcie.link.width.max
      --format=csv,noheader,nounits
  register: gpu_nvidia_info
  changed_when: false
  when: gpu_nvidia_available | bool

- name: Validate NVIDIA eGPU detection mode
  ansible.builtin.assert:
    that:
      - gpu_nvidia_egpu_mode | string | lower in ['auto', 'true', 'false']
    fail_msg: "gpu_nvidia_egpu_mode must be 'auto', true, or false."
  when: gpu_nvidia_available | bool

- name: Validate NVIDIA GPU information format
  ansible.builtin.assert:
    that:
      - gpu_nvidia_info.stdout.split(',') | length == 4
      - gpu_nvidia_info.stdout.split(',')[0] | trim is match('^[0-9]+$')
      - gpu_nvidia_info.stdout.split(',')[1] | trim is match('^[0-9]+$')
      - gpu_nvidia_info.stdout.split(',')[2] | trim is match('^[0-9]+$')
      - gpu_nvidia_info.stdout.split(',')[3] | trim is match('^[0-9]+$')
    fail_msg: >-
      Could not parse NVIDIA GPU memory/PCIe information from nvidia-smi:
      {{ gpu_nvidia_info.stdout | default('no output') }}.
  when: gpu_nvidia_available | bool

- name: Set NVIDIA GPU resource facts
  ansible.builtin.set_fact:
    gpu_nvidia_vram_total_mb: "{{ gpu_nvidia_info.stdout.split(',')[0] | trim | int }}"
    gpu_nvidia_vram_free_mb: "{{ gpu_nvidia_info.stdout.split(',')[1] | trim | int }}"
    gpu_nvidia_pcie_width_current: "{{ gpu_nvidia_info.stdout.split(',')[2] | trim | int }}"
    gpu_nvidia_pcie_width_max: "{{ gpu_nvidia_info.stdout.split(',')[3] | trim | int }}"
    gpu_nvidia_is_egpu: >-
      {{
        (gpu_nvidia_egpu_mode | string | lower == 'true')
        or (
          gpu_nvidia_egpu_mode | string | lower == 'auto'
          and (gpu_nvidia_info.stdout.split(',')[2] | trim | int) > 0
          and (gpu_nvidia_info.stdout.split(',')[3] | trim | int)
              > (gpu_nvidia_info.stdout.split(',')[2] | trim | int)
        )
      }}
  when: gpu_nvidia_available | bool

- name: Validate NVIDIA GPU memory values
  ansible.builtin.assert:
    that:
      - gpu_nvidia_vram_total_mb | int > 0
      - gpu_nvidia_vram_free_mb | int >= 0
    fail_msg: "nvidia-smi returned invalid NVIDIA GPU memory information."
  when: gpu_nvidia_available | bool

- name: Report NVIDIA GPU resources and eGPU heuristic
  ansible.builtin.debug:
    msg: >-
      NVIDIA GPU {{ gpu_nvidia_index }}: {{ gpu_nvidia_vram_free_mb }} MiB free
      of {{ gpu_nvidia_vram_total_mb }} MiB; PCIe link
      x{{ gpu_nvidia_pcie_width_current }}/x{{ gpu_nvidia_pcie_width_max }};
      reduced-link eGPU heuristic={{ gpu_nvidia_is_egpu }}.
      Set gpu_nvidia_egpu_mode explicitly to override the heuristic.
  when: gpu_nvidia_available | bool

- name: Report NVIDIA runtime issue
  ansible.builtin.debug:
    msg: >-
      NVIDIA device was detected on host {{ inventory_hostname }}, but nvidia-smi is unavailable.
      rc={{ gpu_nvidia_smi_recheck.rc | default(gpu_nvidia_smi_check.rc | default('n/a')) }}
      stderr={{ gpu_nvidia_smi_recheck.stderr | default(gpu_nvidia_smi_check.stderr | default('')) | trim }}
  when:
    - gpu_nvidia_device.stat.exists | default(false)
    - not (gpu_nvidia_available | default(false))

- name: Fail when NVIDIA runtime is required but unhealthy
  ansible.builtin.fail:
    msg: >-
      NVIDIA device is present but driver/runtime is not usable on host {{ inventory_hostname }}.
      nvidia-smi failed with rc={{ gpu_nvidia_smi_recheck.rc | default(gpu_nvidia_smi_check.rc | default('n/a')) }}
      stderr={{ gpu_nvidia_smi_recheck.stderr | default(gpu_nvidia_smi_check.stderr | default('')) | trim }}.
      Resolve host NVIDIA driver state, then rerun.
  when:
    - gpu_fail_if_nvidia_unhealthy | bool
    - gpu_nvidia_device.stat.exists | default(false)
    - not (gpu_nvidia_available | default(false))
