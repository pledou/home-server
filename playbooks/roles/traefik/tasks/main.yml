---

- name: Create traefik config directory
  file:
    path: "{{ docker_volumes_path }}/traefik"
    state: directory
    mode: u=rwx,g=o=

- name: Create traefik dynamic config directory
  file:
    path: "{{ docker_volumes_path }}/traefik/dynamics"
    state: directory
    mode: u=rwx,g=o=

- name: Create traefik logs directory
  file:
    path: "{{ docker_volumes_path }}/traefik/logs"
    state: directory
    mode: u=rw,g=o=r

- name: Create unbound data directory
  file:
    path: "{{ docker_volumes_path }}/unbound"
    state: directory
    mode: u=rw,g=o=r
    owner: "{{ ansible_user }}"
  when: unbound is defined and unbound

- name: Detect DHCP upstream DNS server
  block:
    - name: Read DHCP leases
      command: cat /var/lib/dhcp/dhclient.leases
      register: dhcp_leases
      changed_when: false
      failed_when: false

    - name: Extract domain-name-servers
      set_fact:
        dhcp_dns: "{{ (dhcp_leases.stdout | regex_search('domain-name-servers (.+);') | regex_replace('domain-name-servers ', '') | regex_replace(';', '')).split(', ') }}"
      when: "'domain-name-servers' in dhcp_leases.stdout"

    - name: Set default DNS if DHCP query failed
      set_fact:
        dhcp_dns: ["8.8.8.8", "8.8.4.4"]
      when: dhcp_dns is not defined

  when: unbound is defined and unbound

- name: Generate traefik static config
  template:
    src: traefik-static.yml.j2
    dest: "{{ docker_volumes_path }}/traefik/traefik.yml"
    mode: u=rw,g=,o=

- name: Generate traefik dynamic config
  template:
    src: traefik-dynamic.yml.j2
    dest: "{{ docker_volumes_path }}/traefik/dynamics/file-provider.yml"
    mode: u=rw,g=,o=

- name: Copy unbound config files
  copy:
    src: "{{ item }}"
    dest: "{{ docker_volumes_path }}/unbound/{{ item }}"
    mode: u=rw,g=o=r
    owner: "{{ ansible_user }}"
  loop:
    - unbound.conf
    - a-records.conf
  when: unbound is defined and unbound

- name: Generate unbound horizon-switch script
  template:
    src: unbound-horizon-switch.sh.j2
    dest: "{{ docker_volumes_path }}/unbound/horizon-switch.sh"
    mode: u=rwx,g=o=
  when: unbound is defined and unbound

- name: Generate traefik compose
  template:
    src: traefik-compose.yml.j2
    dest: "{{ docker_volumes_path }}/traefik/docker-compose.yml"
    mode: u=rw,g=,o=
