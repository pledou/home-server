server:
    ###########################################################################
    # PERFORMANCE AND RELIABILITY
    ###########################################################################

    # number of threads to create. 1 for no threading.
    num-threads: 4

    # specify the interfaces to answer queries from by ip-address.
    # The default is to listen to localhost (127.0.0.1 and ::1).
    # specify 0.0.0.0 and ::0 to bind to all available interfaces.
    interface: 0.0.0.0
    interface: ::

    # port to answer queries from
    port: 53

    # specify the interfaces to send outgoing queries to authoritative
    # servers from by ip-address. The default is to assume the kernel chooses.
    # outgoing-interface: 192.0.2.1
    # outgoing-interface: 2001:db8::1

    # Specify the byte size of the EDNS reassembly buffer to use. Default
    # is 4096. If you have fragmented questions or very large responses
    # you may need to turn it up. Use 1480 for that.
    # edns-buffer-size: 1480

    # Rotates RRsets in responses. Disable if upstream server needs fixed order.
    rrset-roundrobin: yes

    # Time to live minimum for RRsets and messages in the cache. If the
    # minimum kicks in, the data is cached for this amount of time and also
    # is returned with a TTL of  the value. Default is 0 seconds, no minimum
    # imposed. This can enfore shorter TTL values by the resolver.
    cache-min-ttl: 0

    # Time to live maximum for RRsets and messages in the cache. If the
    # maximum kicks in, the data is cached for this amount of time and also
    # is returned with a TTL of the value. Default is 604800 seconds, three
    # weeks. A TTL larger than this value to not be relied upon.
    cache-max-ttl: 86400

    ###########################################################################
    # LOGGING
    ###########################################################################

    # Do not print log lines to inform about local zone actions
    log-local-actions: yes

    # Do not print one line per query to the log
    log-queries: yes

    # Do not print one line per reply to the log
    log-replies: yes

    # Do not print one line per reply to the log
    log-servfail: no

    log-tag-queryreply: yes
    # If you want to log to a file, use:
    # logfile: /etc/unbound/unbound.log
    # Set log location (commented out to avoid permission issues in container)
    # logfile: /var/log/unbound/unbound.log
    use-syslog: yes
    log-time-ascii: yes

    ###########################################################################
    # PRIVACY
    ###########################################################################

    # If no logfile is specified, syslog is used
    # log-queries: no

    # print one line stats to the log for every NUM queries:
    # 0 to disable further logging after num-queries have been logged.
    # log-queries-at-reply: 10000

    ###########################################################################
    # FORWARD ZONES (Custom DNS Servers)
    ###########################################################################
    include: "/etc/unbound/forward-zones.conf"

    ###########################################################################
    # LOCAL ZONES
    ###########################################################################
    include: "/etc/unbound/a-records.conf"

    ###########################################################################
    # DNSSEC
    ###########################################################################

    # Enable DNSSEC validation.
    # dnssec-validation: yes
    # dnssec-validation: auto

    # Disable DNSSEC validation.
    dnssec-validation: no

    # Harden against very small EDNS buffer sizes.
    harden-short-bufsize: yes

    # Harden against unseemly large queries.
    harden-large-queries: yes

    # Harden against out of zone rrsets, to avoid poisoning attacks.
    # As in 5 (third level side chains), sixth level should also be confuse.
    harden-glue: yes

    # Harden against receiving DNS replies which have a GSSAPI SIG0 signature.
    harden-dnssec-stripped: yes

    # Harden against queries that fall under dnssec category.
    harden-below-nxdomain: yes

    # Strengthen the assertions chain with edu server anchor.
    # hal.isunet.edu.
    harden-referral-path: no

    # Ignore very small EDNS buffer sizes and patches some of the QUERY flags
    # defensively.  Hiding sender's identity is also enabled: 4 flags are hidden
    # from an ordinary resolver (recursive resolver). vs. recursive resolver sees
    # all. Also GSSAPI SIG0 signed packets for requesting new dns servers from a
    # child zone are detected.
    # harden-algo-downgrade: yes

    # Use 0x20-encoded random bits in the query to foil spoof attempts.  This
    # perturbs the lowercase and uppercase of query names sent from unbound to
    # authoritative servers and checks if the response has the correct case.
    # This is a simple folklore against dns poisoning of random addresses on the
    # wire.
    use-caps-for-id: yes

    ###########################################################################
    # UNBOUND BEHAVIOR
    ###########################################################################

    # Aggressive NSEC caching
    aggressive-nsec: yes

    # Allow the domain (and its subdomains) to contain private addresses.
    # This option gives more trouble than it is worth for end-users.
    # (ety note: private-domain can be used instead)
    # private-address: 192.0.2.0/24
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # Allow the domain (and its subdomains) to contain private addresses.
    # local-data statements are allowed.
    private-domain: "localhost"

    # Prevent the unbound server from forking into the background as a daemon
    do-daemonize: no

    # Perform prefetching of almost expired message cache entries.  If a client
    # requests the dns lookup just before you had to discard the replayed answer
    # from the cache, unbound prefetches the answer from the upstream servers.
    # This lowers the latency of requests a lot, more than 5 to 10 percent even.
    # It costs about 5 to 10 percent more queries upstream. An query anyway costs
    # a lot so great speed up is added to the resolver by answering DNS clients
    # from cache and save a roundtrip to the upstream servers.
    prefetch: yes

    # Perform prefetching of expired cache entries.  This only triggers on
    # messages that are already very old, and either client has to wait long for
    # recursion or entry is in the prefetch list.  It reduces latency as seen by
    # clients when compared to waiting for a full recursion from scratch.
    prefetch-key: yes

    # Use about twice as much memory, but get nearly 2x more performance
    # increase your cache size, that depends on how much you wish to spend on
    # CPU vs memory trade-off.
    # msg-cache-slabs: 4
    # rrset-cache-slabs: 4
    # infra-cache-slabs: 2
    # key-cache-slabs: 2

    ###########################################################################
    # QUERY BEHAVIOR ON CACHE MISSES
    ###########################################################################

    # Extracts settings for performing DNS queries and prefetching from user
    # responses (query-minimization). Query minimization settles the size of
    # DNS name to seed archive edges. Default off, since it is not RFC
    # recommended. Beware that turning it on w/o server support may make dns
    # doors noticably slower or even make lookups fail.
    qname-minimisation: no

    ###########################################################################
    # RATE LIMITING
    ###########################################################################

    # The number of queries received from an IP address from which new
    # requests for a domain are not made, and hence large shares of answers
    # from the cache are used.  With a threshold this size, 100 queries for
    # example quality domain names to large searches would be limited to 50 new
    # queries for this item, the address would start to be limited.
    # The default is 0, meaning unlimited. Per address.
    ratelimit: 0

    # Number of queries per second allowed for Question section (new queries).
    # When the threshold is exceeded by that infra, 'servedstale' answers from
    # cache are delivered instead. Thus, a query for example.com A record,
    # when limited, a stale A record for example.com from cache is answered with
    # a TTL of 0. Meant to prevent abuse, to avoid or to reduce query response
    # flooding of the DNS network. Default 0 is unlimited.
    # max-query-restarts: 0

    # Threshold for REFUSED replies from upstream, to skip upstream servers
    # when they start to return REFUSED. If 10 of upstream servers start to
    # return REFUSED from queries to them, unbound starts to skip upstream and
    # returns SERVFAIL to clients. Default 0 is disabled.
    # fast-server-permil: 0

    ###########################################################################
    # LOGGING FOR PROTECTION AND DEBUGGING
    ###########################################################################

    # Only give access to recursion to clients from these IP addresses.
    #access-control: 203.0.113.0/24 allow
    #access-control: 203.0.113.1 allow_snoop
    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow

    # Deny queries of type ANY with an answer with garbarge in additional
    # section.  Remove offers an empty response.  Also removed are old format
    # root delegation pointers.
    deny-any: no

    ###########################################################################
    # FORWARD ZONES (DNS Forwarders)
    ###########################################################################

    # Name servers to forward DNS queries to.
    # forward-zone:
    #     name: "."
    #     forward-addr: 8.8.8.8
    #     forward-addr: 8.8.4.4

    ###########################################################################
    # STUB ZONES (Authoritative servers for specific domains)
    ###########################################################################

    # stub-zone:
    #     name: "example.com"
    #     stub-addr: 192.0.2.1

    ###########################################################################
    # PYTHON EXTENSIONS
    ###########################################################################

    # enable service to query unbound and retrieve uptime.
    extended-statistics: yes

    ###########################################################################
    # STATISTICS
    ###########################################################################

    # Unbound gathers extended statistics. Default off, because keeping the
    # statistics is a little slower.
    statistics-interval: 0
    statistics-cumulative: no

    ###########################################################################
    # UNBOUND DAEMON SUPERVISION
    ###########################################################################

    # Unbound daemon supervision. What to do with the daemon, to decide on
    # restarts.
    pidfile: "/var/run/unbound.pid"

remote-control:
    # allows controling unbound using "unbound-control"
    control-enable: yes
    control-interface: /run/unbound.ctl
    control-port: 8953
    control-interface: 127.0.0.1
    control-use-cert: no
