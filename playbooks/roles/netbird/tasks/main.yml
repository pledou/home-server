# code: language=ansible
---
- name: Verify stacks directory exists
  ansible.builtin.file:
    path: "{{ stacks_base_path }}/netbird"
    state: directory
    mode: u=rwx,go=
- name: Configure Authentik OAuth application for NetBird
  become: false
  when: authentik_api_token is defined
  block:
    - name: Configure Authentik OAuth provider and application for NetBird
      ansible.builtin.include_tasks: "tasks/authentik_common.yml"
      vars:
        oauth_apps:
          - provider:
              name: "netbird-oauth-provider"
              redirect_uris:
                - url: "https://vpn.{{ app_domain_name }}/nb-auth"
                  matching_mode: "strict"
                - url: "https://vpn.{{ app_domain_name }}/nb-silent-auth"
                  matching_mode: "strict"
                - url: "http://localhost:53000/"
                  matching_mode: "strict"
              client_type: "public"
              token_endpoint_auth_method: "none"   # important pour PKCE public SPA
              sub_mode: "user_email"
              include_claims_in_id_token: true
              issuer_mode: "per_provider"
              access_code_validity: "minutes=1"
              access_token_validity: "minutes=10"
              refresh_token_validity: "days=30"
              grant_types:
                - "authorization_code"
                - "refresh_token"
              scopes: "openid profile email"
            app:
              name: "netbird"
              slug: "netbird-vpn"
              open_in_new_tab: true
              meta_launch_url: "https://vpn.{{ app_domain_name }}"
              meta_description: "NetBird VPN access with OIDC authentication"
              meta_publisher: "NetBird"

- name: Create NetBird provisioning directories
  become: "{{ not local_safe }}"
  ansible.builtin.file:
    path: "{{ docker_volumes_path }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "netbird"
    - "netbird/config"
    - "netbird/data"

- name: Retrive secret for encryption
  ansible.builtin.include_tasks: "tasks/retrieve_password.yml"
  vars:
    secrets:
      - name: netbird_session_cookie_encryption_key
        length: 64
      - name: netbird_datastore_encryption_key
        length: 48 #  FATL management/internals/server/boot.go:97: failed to create field encryptor: encryption key must be 32 bytes, got 24 -> We should have openssl rand -base64 32 ending by ==

- name: Create NetBird config file
  become: "{{ not local_safe }}"
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ docker_volumes_path }}/netbird/config/config.yaml"
    mode: u=rwx,g=o=

- name: Create NetBird docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stacks_base_path }}/netbird/docker-compose.yml"
    mode: u=g=rwx,o=rx

- name: Try to pull latest images (continue on failure)
  community.docker.docker_compose_v2:
    pull: "always"
    state: present
    project_src: "{{ stacks_base_path }}/netbird"
  ignore_errors: true
  register: pull_result

- name: Warning - using local images
  ansible.builtin.debug:
    msg: "WARNING: Could not pull latest images. Deploying with existing local images."
  when: pull_result is failed

- name: Deploy stack from a compose file
  community.docker.docker_compose_v2:
    pull: "never"
    build: "always"
    state: present
    project_src: "{{ stacks_base_path }}/netbird"

- name: Configure UFW rules for netbird STUN
  become: "{{ not local_safe }}"
  community.general.ufw:
    rule: allow
    port: "{{ netbird_stun_port }}"
    proto: udp
    comment: "netbird STUN"

