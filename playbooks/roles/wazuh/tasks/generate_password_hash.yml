---
- name: Check for a stored Wazuh password hash
  become: "{{ not local_safe }}"
  ansible.builtin.stat:
    path: "{{ wazuh_secrets_path }}/{{ wazuh_password_item.secret_name }}.hash"
  register: wazuh_password_hash_stat

- name: Check for a stored Wazuh password fingerprint
  become: "{{ not local_safe }}"
  ansible.builtin.stat:
    path: "{{ wazuh_secrets_path }}/{{ wazuh_password_item.secret_name }}.fingerprint"
  register: wazuh_password_fingerprint_stat

- name: Read the stored Wazuh password fingerprint
  become: "{{ not local_safe }}"
  ansible.builtin.slurp:
    src: "{{ wazuh_secrets_path }}/{{ wazuh_password_item.secret_name }}.fingerprint"
  register: wazuh_password_fingerprint_file
  when:
    - wazuh_password_hash_stat.stat.exists
    - wazuh_password_fingerprint_stat.stat.exists
  no_log: true

- name: Determine whether to regenerate the Wazuh password hash
  ansible.builtin.set_fact:
    wazuh_password_hash_needs_update: >-
      {{
        not wazuh_password_hash_stat.stat.exists
        or not wazuh_password_fingerprint_stat.stat.exists
        or (wazuh_password_fingerprint_file.content | b64decode | trim)
          != (wazuh_password_item.password | hash('sha256'))
      }}
  no_log: true

- name: Generate a Wazuh password hash
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -i
      - "wazuh/wazuh-indexer:{{ wazuh_version }}"
      - bash
      - -c
      - >-
        IFS= read -r WAZUH_HASH_PASSWORD &&
        export WAZUH_HASH_PASSWORD &&
        exec /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh
        -env WAZUH_HASH_PASSWORD
    stdin: "{{ wazuh_password_item.password }}"
  register: wazuh_password_hash_command
  changed_when: false
  failed_when: false
  when: wazuh_password_hash_needs_update
  no_log: true

- name: Validate Wazuh password hash generation
  ansible.builtin.assert:
    that:
      - wazuh_password_hash_command.rc == 0
    fail_msg: >-
      Could not generate a bcrypt hash for Wazuh user
      {{ wazuh_password_item.name }} using the pinned indexer image.
  when: wazuh_password_hash_needs_update

- name: Extract the generated Wazuh password hash
  ansible.builtin.set_fact:
    wazuh_generated_password_hash: >-
      {{
        wazuh_password_hash_command.stdout
        | regex_search('[$]2[aby][$][0-9]{2}[$][./A-Za-z0-9]{53}')
      }}
  when: wazuh_password_hash_needs_update
  no_log: true

- name: Validate the generated Wazuh password hash
  ansible.builtin.assert:
    that:
      - wazuh_generated_password_hash is string
      - wazuh_generated_password_hash | length == 60
    fail_msg: "Wazuh did not return a valid bcrypt password hash."
  when: wazuh_password_hash_needs_update

- name: Store the generated Wazuh password hash
  become: "{{ not local_safe }}"
  ansible.builtin.copy:
    content: "{{ wazuh_generated_password_hash }}"
    dest: "{{ wazuh_secrets_path }}/{{ wazuh_password_item.secret_name }}.hash"
    owner: root
    group: root
    mode: "0600"
  when: wazuh_password_hash_needs_update
  no_log: true

- name: Store the Wazuh password fingerprint
  become: "{{ not local_safe }}"
  ansible.builtin.copy:
    content: "{{ wazuh_password_item.password | hash('sha256') }}"
    dest: "{{ wazuh_secrets_path }}/{{ wazuh_password_item.secret_name }}.fingerprint"
    owner: root
    group: root
    mode: "0600"
  when: wazuh_password_hash_needs_update
  no_log: true

- name: Load the stored Wazuh password hash
  become: "{{ not local_safe }}"
  ansible.builtin.slurp:
    src: "{{ wazuh_secrets_path }}/{{ wazuh_password_item.secret_name }}.hash"
  register: wazuh_password_hash_file
  no_log: true

- name: Set the Wazuh password hash fact
  ansible.builtin.set_fact:
    "{{ wazuh_password_item.hash_fact }}": "{{ wazuh_password_hash_file.content | b64decode | trim }}"
  no_log: true
...
