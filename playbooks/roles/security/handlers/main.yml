# code: language=ansible
---
- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  become: "{{ not local_safe }}"

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  become: "{{ not local_safe }}"

- name: Restart wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    state: restarted
  become: "{{ not local_safe }}"
...
