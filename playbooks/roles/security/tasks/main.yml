# code: language=ansible
---
- name: Include Wazuh agent tasks
  ansible.builtin.include_tasks: wazuh_agent.yml
  when: security_wazuh_agent_enabled | bool
  tags:
    - security
    - wazuh

- name: Include SSH hardening tasks
  ansible.builtin.include_tasks: ssh_hardening.yml
  tags:
    - security
    - ssh

- name: Include fail2ban tasks
  ansible.builtin.include_tasks: fail2ban.yml
  when: fail2ban_enabled | bool
  tags:
    - security
    - fail2ban

- name: Include Wazuh agent tasks
  ansible.builtin.include_tasks: wazuh_agent.yml
  when:
    - security_wazuh_agent_enabled | bool
    - not local_safe
  tags:
    - security
    - wazuh
...
