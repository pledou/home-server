# code: language=ansible
---
- name: Verify stacks directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/home-server/stacks/ia"
    state: directory
    mode: u=rwx,g=o=rx

- name: Create ia provisionning directories (root-owned)
  become: true
  ansible.builtin.file:
    path: "{{ docker_volumes_path }}/{{ item.name }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('u=rwx,g=rx,o=') }}"
  loop:
    - name: ollama
    - name: ollama-embeddings
    - name: open-webui
    - name: chromadb
    - name: synapse-data
      owner: 991
      group: 991
    - name: synapse-data/media_store
      owner: 991
      group: 991
    - name: synapse-postgres-data
      owner: 999
      group: 999
    - name: synapse-redis-data
      owner: 999
      group: 999
    - name: mindroom-data
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"
    - name: mindroom-data/sessions
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"
    - name: mindroom-data/learning
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"
    - name: mindroom-data/tracking
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"
    - name: mindroom-data/memory  # For mem0/chroma vector DB
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"
    - name: mindroom-data/credentials
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"
    - name: mindroom-logs
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"
    - name: mindroom-config
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"    
    - name: mindroom-sandbox-workspace
      owner: "{{ ansible_user }}"
      group: "{{ ansible_group }}"

- name: Generate Synapse signing key if it doesn't exist
  become: true
  ansible.builtin.shell:
    cmd: |
      echo "No signing key found. Generating one..."
      python3 -m synapse.crypto.signing_key -o "{{ docker_volumes_path }}/synapse-data/signing.key"
      echo "Signing key generated."
    creates: "{{ docker_volumes_path }}/synapse-data/signing.key"
    executable: /bin/bash

- name: Ensure Synapse signing key has correct ownership and permissions
  become: true
  ansible.builtin.file:
    path: "{{ docker_volumes_path }}/synapse-data/signing.key"
    owner: 991
    group: 991
    mode: '0644'
  ignore_errors: true

- name: Retrive secrets
  ansible.builtin.include_tasks: "retrieve_password.yml"
  vars:
    secrets:
      - name: synapse_postgres_password
      - name: synapse_macaroon_secret_key
        length: 32
        chars: hexdigits

- name: Create Speaches cache directory (ubuntu-owned)
  become: true
  ansible.builtin.file:
    path: "{{ docker_volumes_path }}/speaches-hf-cache"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: u=rwx,g=o=rx

- name: Report detected IA GPU mode
  ansible.builtin.debug:
    msg: "IA GPU mode selected: effective={{ gpu_mode_effective | default('none') }}"

- name: Configure Authentik OAuth Webui for IA
  # delegate_to: localhost
  become: false
  when: authentik_api_token is defined
  block:
    - name: Configure Authentik OAuth provider and application for IA WebUI
      when: authentik_api_token is defined
      ansible.builtin.include_tasks: "tasks/authentik_common.yml"
      vars:
        oauth_apps:
          - provider:
              name: "webui-oauth-provider"
              redirect_uris:
                - url: "https://ia.{{ app_domain_name }}/oauth/oidc/callback"
                  matching_mode: "strict"
              client_type: "confidential"
              sub_mode: "user_email"
              include_claims_in_id_token: true
              issuer_mode: "per_provider"
              access_code_validity: "minutes=1"
              access_token_validity: "minutes=10"
              refresh_token_validity: "days=30"
              scopes: "openid profile email"
            app:
              name: "WebUI"
              slug: "{{ webui_oauth_slug_name }}"
              open_in_new_tab: true
              meta_launch_url: "https://ia.{{ app_domain_name }}"
              meta_description: "AI WebUI for speech and language processing"
              meta_publisher: "IA Services"

    - name: Set WebUI OAuth credentials as facts
      when:
        - oauth_provider_client_id is defined
        - oauth_provider_client_secret is defined
        - current_oauth_provider_name == "webui-oauth-provider"
      ansible.builtin.set_fact:
        webui_oauth_client_id: "{{ oauth_provider_client_id }}"
        webui_oauth_client_secret: "{{ oauth_provider_client_secret }}"

    - name: Ensure secrets directory exists for Docker secret mounts
      become: true
      ansible.builtin.file:
        path: "{{ docker_volumes_path }}/secrets"
        state: directory
        mode: '0700'
      when:
        - webui_oauth_client_id is defined
        - webui_oauth_client_id | length > 0

    - name: Write OAuth client ID secret file
      become: true
      ansible.builtin.copy:
        content: "{{ webui_oauth_client_id }}"
        dest: "{{ docker_volumes_path }}/secrets/webui_oauth_client_id"
        mode: '0600'
      when:
        - webui_oauth_client_id is defined
        - webui_oauth_client_id | length > 0

    - name: Write OAuth client secret file
      become: true
      ansible.builtin.copy:
        content: "{{ webui_oauth_client_secret }}"
        dest: "{{ docker_volumes_path }}/secrets/webui_oauth_client_secret"
        mode: '0600'
      when:
        - webui_oauth_client_secret is defined
        - webui_oauth_client_secret | length > 0

- name: Configure Authentik access mindroom
  # delegate_to: localhost
  become: false
  when: authentik_api_token is defined
  block:
    - name: Configure Authentik OAuth provider and application for IA Matrix
      when: authentik_api_token is defined
      ansible.builtin.include_tasks: "tasks/authentik_common.yml"
      vars:
        oauth_apps:
          - provider:
              name: "matrix-synapse-provider"
              redirect_uris:
                - url: "https://m.{{ app_domain_name }}/oauth/oidc/callback"
                  matching_mode: "strict"
              client_type: "confidential"
              sub_mode: "user_email"
              include_claims_in_id_token: true
              issuer_mode: "per_provider"
              access_code_validity: "minutes=1"
              access_token_validity: "minutes=10"
              refresh_token_validity: "days=30"
              scopes: "openid profile email"
            app:
              name: "Matrix Synapse"
              slug: "{{ matrix_oauth_slug_name }}"
              meta_launch_url: "https://m.{{ app_domain_name }}"
              meta_description: "Synapse Matrix server for secure messaging and collaboration."
        provider_apps:
          - provider:
              name: "mindroom-provider"
              external_host: "https://mindroom.{{ app_domain_name }}"
            app:
              name: "MindRoom"
              slug: "mindroom"

    - name: Set Matrix OAuth credentials as facts
      when:
        - oauth_provider_client_id is defined
        - oauth_provider_client_secret is defined
        - current_oauth_provider_name == "matrix-synapse-provider"
      ansible.builtin.set_fact:
        matrix_oauth_client_id: "{{ oauth_provider_client_id }}"
        matrix_oauth_client_secret: "{{ oauth_provider_client_secret }}"

    - name: Ensure secrets directory exists for Docker secret mounts
      become: true
      ansible.builtin.file:
        path: "{{ docker_volumes_path }}/secrets"
        state: directory
        mode: '0700'
      when:
        - matrix_oauth_client_id is defined
        - matrix_oauth_client_id | length > 0

    - name: Write OAuth client ID secret file
      become: true
      ansible.builtin.copy:
        content: "{{ matrix_oauth_client_id }}"
        dest: "{{ docker_volumes_path }}/secrets/matrix_oauth_client_id"
        mode: '0600'
      when:
        - matrix_oauth_client_id is defined
        - matrix_oauth_client_id | length > 0

    - name: Write OAuth client secret file
      become: true
      ansible.builtin.copy:
        content: "{{ matrix_oauth_client_secret }}"
        dest: "{{ docker_volumes_path }}/secrets/matrix_oauth_client_secret"
        mode: '0600'
      when:
        - matrix_oauth_client_secret is defined
        - matrix_oauth_client_secret | length > 0

- name: Create Synapse homeserver.yaml with Authentik OIDC config
  become: true
  ansible.builtin.template:
    src: synapse_homeserver.yaml
    dest: "{{ docker_volumes_path }}/synapse-data/homeserver.yaml"
    mode: u=rw,g=o=r
    owner: 991
    group: 991
- name: Create Synapse log.config with Authentik OIDC config
  become: true
  ansible.builtin.template:
    src: synapse_log.config
    dest: "{{ docker_volumes_path }}/synapse-data/log.config"
    mode: u=rw,g=o=r
    owner: 991
    group: 991

- name: Create Mindroom mindroom_config.yaml
  become: true
  ansible.builtin.template:
    src: mindroom_config.yaml
    dest: "{{ docker_volumes_path }}/mindroom-config/config.yaml"
    mode: u=rw,g=o=r
    owner: "{{ ansible_user }}"
    group: "{{ ansible_group }}"
- name: Create Mindroom-chat client-config.json
  become: true
  ansible.builtin.template:
    src: mindroom_client-config.json
    dest: "{{ docker_volumes_path }}/mindroom-config/client-config.json"
    mode: u=rw,g=o=r
    owner: "{{ ansible_user }}"
    group: "{{ ansible_group }}"
    force: true

- name: Create docker-compose stack file
  ansible.builtin.template:
    src: docker-compose.yml
    dest: /home/{{ ansible_user }}/home-server/stacks/ia/docker-compose.yml
    mode: u=rwx,g=o=rx
  vars:
    gpu: "{{ gpu_mode_effective | default('none') }}"

- name: Create Speaches model aliases file
  ansible.builtin.template:
    src: speaches_model_aliases.json
    dest: /home/{{ ansible_user }}/home-server/stacks/ia/model_aliases.json
    mode: u=rw,g=o=r

- name: Create override Dockerfile for ollama-metrics
  ansible.builtin.template:
    src: ollama-metrics.Dockerfile
    dest: /home/{{ ansible_user }}/home-server/stacks/ia/ollama-metrics.Dockerfile
    mode: u=rwx,g=o=rx

- name: Create OpenWebUI API proxy config
  ansible.builtin.template:
    src: webui-api-proxy.conf
    dest: /home/{{ ansible_user }}/home-server/stacks/ia/webui-api-proxy.conf
    mode: u=rw,g=o=r

- name: Deploy stack from a compose file
  community.docker.docker_compose_v2:
    pull: "always"
    build: "always"
    state: present
    project_src: /home/{{ ansible_user }}/home-server/stacks/ia

- name: Wait for Ollama API tags endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/api/tags"
    method: GET
    status_code: 200
  register: ia_ollama_tags
  retries: 30
  delay: 2
  until: ia_ollama_tags.status == 200

- name: Wait for Ollama Embeddings API tags endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:8082/api/tags"
    method: GET
    status_code: 200
  register: ia_ollama_embeddings_tags
  retries: 30
  delay: 2
  until: ia_ollama_embeddings_tags.status == 200

- name: Compute required and installed Ollama model lists
  ansible.builtin.set_fact:
    ia_ollama_installed_models: "{{ (ia_ollama_tags.json.models | default([])) | map(attribute='name') | list }}"
    ia_ollama_embeddings_installed_models: >-
      {{ (ia_ollama_embeddings_tags.json.models | default([])) | map(attribute='name') | list }}
    ia_ollama_required_llm_models: >-
      {{
        [ia_homeassistant_agent_model]
        | select('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}
    ia_ollama_required_embedding_models: >-
      {{
        [ia_ollama_embedding_model]
        | select('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Pull missing Ollama LLM models for IA integrations
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/api/pull"
    method: POST
    body_format: json
    body:
      name: "{{ item }}"
      stream: false
    status_code:
      - 200
      - 404
      - 500
  register: ia_ollama_llm_pull_results
  loop: "{{ ia_ollama_required_llm_models | default([]) }}"
  when:
    - item is string
    - item | length > 0
    - item not in (ia_ollama_installed_models | default([]))

- name: Pull missing Ollama embedding models to embeddings instance
  ansible.builtin.uri:
    url: "http://127.0.0.1:8082/api/pull"
    method: POST
    body_format: json
    body:
      name: "{{ item }}"
      stream: false
    status_code:
      - 200
      - 404
      - 500
  register: ia_ollama_embeddings_pull_results
  loop: "{{ ia_ollama_required_embedding_models | default([]) }}"
  when:
    - item is string
    - item | length > 0
    - item not in (ia_ollama_embeddings_installed_models | default([]))

- name: Warn for unknown Ollama LLM model names
  ansible.builtin.debug:
    msg: >-
      Ollama LLM model '{{ item.item }}' could not be pulled to main instance.
      Status {{ item.status }}: {{ item.json.error | default('unknown error') }}.
      Check model name availability in your Ollama registry.
  loop: "{{ ia_ollama_llm_pull_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - (item.status | default(0) | int) in [404, 500]

- name: Warn for unknown Ollama embedding model names
  ansible.builtin.debug:
    msg: >-
      Ollama embedding model '{{ item.item }}' could not be pulled to embeddings instance (port 8082).
      Status {{ item.status }}: {{ item.json.error | default('unknown error') }}.
      Check model name availability in your Ollama registry.
      For multilingual E5, try fully-qualified tags like
      intfloat/multilingual-e5-small or intfloat/multilingual-e5-base.
  loop: "{{ ia_ollama_embeddings_pull_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - (item.status | default(0) | int) in [404, 500]

- name: Wait for Speaches API health
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/health"
    method: GET
    status_code: 200
  register: speaches_health_check
  retries: 30
  delay: 2
  until: speaches_health_check.status == 200

- name: Retrieve currently installed Speaches models
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/v1/models"
    method: GET
    status_code:
      - 200
      - 500
  register: speaches_local_models

- name: Warn when Speaches model listing fails
  when:
    - (speaches_local_models.status | int) != 200
  ansible.builtin.debug:
    msg: >-
      Speaches returned status {{ speaches_local_models.status }} on /v1/models.
      Continuing with empty installed-model list and attempting configured post-deploy downloads.

- name: Compute already installed Speaches model IDs
  ansible.builtin.set_fact:
    speaches_installed_model_ids: >-
      {{
        ((speaches_local_models.json.data | default([])) | map(attribute='id') | list)
        if ((speaches_local_models.status | int) == 200 and (speaches_local_models.json is defined))
        else []
      }}

- name: Download missing Speaches models via API
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/v1/models/{{ item | urlencode }}"
    method: POST
    status_code:
      - 200
      - 201
      - 202
      - 409
      - 404
      - 500
  register: speaches_model_download_results
  loop: "{{ speaches_postdeploy_models | default([]) }}"
  when:
    - item is string
    - item | length > 0
    - item not in (speaches_installed_model_ids | default([]))

- name: Warn for unknown Speaches model IDs
  ansible.builtin.debug:
    msg: >-
      Speaches model '{{ item.item }}' not found in registry (404) and was skipped.
      Use GET /v1/registry to pick a valid model_id for speaches_postdeploy_models.
  loop: "{{ speaches_model_download_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - (item.status | default(0) | int) == 404

- name: Warn for Speaches internal errors on model download
  ansible.builtin.debug:
    msg: >-
      Speaches returned 500 while downloading '{{ item.item }}'.
      Model was not installed by post-deploy step and was skipped.
      You can retry later, or temporarily set speaches_postdeploy_models to [] to unblock deployment.
  loop: "{{ speaches_model_download_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - (item.status | default(0) | int) == 500

...
