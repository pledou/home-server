# code: language=ansible
---
- name: Verify stacks directory exists
  ansible.builtin.file:
    path: "{{ stacks_base_path }}/ia"
    state: directory
    mode: u=rwx,g=o=rx

- name: Create ia provisionning directories (root-owned)
  become: "{{ not local_safe }}"
  ansible.builtin.file:
    path: "{{ docker_volumes_path }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: u=rwx,g=o=rx
  loop:
    - ollama
    - ollama-embeddings
    - open-webui
    - chromadb


- name: Check if Nextcloud MCP OIDC secrets already exist
  become: "{{ not local_safe }}"
  ansible.builtin.stat:
    path: "{{ docker_volumes_path }}/secrets/nextcloud_mcp_oidc_client_id"
  register: ia_nextcloud_oidc_secrets_stat

- name: Create Nextcloud MCP OIDC client (if not already provided)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --user
      - www-data
      - nc-nextcloud-1
      - php
      - occ
      - oidc:create
      - Nextcloud MCP Server
      - "https://mcp.{{ app_domain_name }}/oauth/callback"
      - --type=confidential
      - "--resource_url=https://mcp.{{ app_domain_name }}/mcp"
  register: ia_nextcloud_mcp_oidc_create_result
  when:
    - nextcloud_mcp_backend == 'standalone'
    - nextcloud_mcp_oidc_client_id | length == 0
    - not ia_nextcloud_oidc_secrets_stat.stat.exists
  changed_when: ia_nextcloud_mcp_oidc_create_result.rc == 0
  failed_when: false
  no_log: true

- name: Validate generated Nextcloud MCP OIDC credentials
  ansible.builtin.assert:
    that:
      - ia_nextcloud_mcp_oidc_create_result.rc == 0
      - ia_nextcloud_mcp_oidc_create_result.stdout is regex('"client_id"\s*:\s*".+"')
      - ia_nextcloud_mcp_oidc_create_result.stdout is regex('"client_secret"\s*:\s*".+"')
    fail_msg: >-
      The H2CK OIDC app failed to create the MCP client or returned invalid
      credentials. Verify the app is installed and the oidc:create command is
      supported.
  when:
    - nextcloud_mcp_backend == 'standalone'
    - nextcloud_mcp_oidc_client_id | length == 0
    - not ia_nextcloud_oidc_secrets_stat.stat.exists

- name: Save Nextcloud MCP OIDC credentials to secrets directory
  become: "{{ not local_safe }}"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ docker_volumes_path }}/secrets/{{ item.name }}"
    mode: '0600'
  no_log: true
  loop:
    - name: nextcloud_mcp_oidc_client_id
      content: "{{ (ia_nextcloud_mcp_oidc_create_result.stdout | from_json).client_id }}"
    - name: nextcloud_mcp_oidc_client_secret
      content: "{{ (ia_nextcloud_mcp_oidc_create_result.stdout | from_json).client_secret }}"
  when:
    - nextcloud_mcp_backend == 'standalone'
    - nextcloud_mcp_oidc_client_id | length == 0
    - ia_nextcloud_mcp_oidc_create_result.stdout is defined

- name: Retrive secret
  ansible.builtin.include_tasks: "retrieve_password.yml"
  vars:
    secrets:
      - webui_secret_key
      - nextcloud_mcp_oidc_client_id
      - nextcloud_mcp_oidc_client_secret

- name: Validate standalone Nextcloud MCP OIDC credentials
  ansible.builtin.assert:
    that:
      - nextcloud_mcp_oidc_client_id | length > 0
      - nextcloud_mcp_oidc_client_secret | length > 0
      - nextcloud_mcp_oidc_client_id != 'NOT_FOUND'
      - nextcloud_mcp_oidc_client_secret != 'NOT_FOUND'
    fail_msg: >-
      Set or generate valid nextcloud_mcp_oidc_client_id and
      nextcloud_mcp_oidc_client_secret for the standalone MCP server.
  when: nextcloud_mcp_backend == 'standalone'

- name: List clients registered in the H2CK OIDC app
  become: "{{ not local_safe }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --user
      - www-data
      - nc-nextcloud-1
      - php
      - occ
      - oidc:list
  register: ia_nextcloud_mcp_oidc_clients
  changed_when: false
  failed_when: false
  no_log: true
  when: nextcloud_mcp_backend == 'standalone'

- name: Validate H2CK OIDC app client registration
  ansible.builtin.assert:
    that:
      - ia_nextcloud_mcp_oidc_clients.rc == 0
      - ia_nextcloud_mcp_oidc_clients.stdout is regex('(?s)^\s*\[.*\]\s*$')
    fail_msg: >-
      Could not read the client list from the H2CK OIDC app. Verify that the
      app is installed and its oidc:list command returns JSON.
  when: nextcloud_mcp_backend == 'standalone'

- name: Check whether the MCP client exists in the H2CK OIDC app
  ansible.builtin.set_fact:
    ia_nextcloud_mcp_oidc_client_found: >-
      {{
        nextcloud_mcp_oidc_client_id | length > 0
        and nextcloud_mcp_oidc_client_secret | length > 0
        and (
          ia_nextcloud_mcp_oidc_clients.stdout | from_json
          | selectattr('client_id', 'equalto', nextcloud_mcp_oidc_client_id)
          | list | length
        ) > 0
      }}
  when: nextcloud_mcp_backend == 'standalone'

- name: Re-enroll Nextcloud MCP OIDC client when it is missing
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --user
      - www-data
      - nc-nextcloud-1
      - php
      - occ
      - oidc:create
      - Nextcloud MCP Server
      - "https://mcp.{{ app_domain_name }}/oauth/callback"
      - --type=confidential
      - "--resource_url=https://mcp.{{ app_domain_name }}/mcp"
  register: ia_nextcloud_mcp_oidc_reenroll_result
  when:
    - nextcloud_mcp_backend == 'standalone'
    - not ia_nextcloud_mcp_oidc_client_found
  changed_when: ia_nextcloud_mcp_oidc_reenroll_result.rc == 0
  failed_when: false
  no_log: true

- name: Validate re-enrolled Nextcloud MCP OIDC credentials
  ansible.builtin.assert:
    that:
      - ia_nextcloud_mcp_oidc_reenroll_result.rc == 0
      - ia_nextcloud_mcp_oidc_reenroll_result.stdout is regex('"client_id"\s*:\s*".+"')
      - ia_nextcloud_mcp_oidc_reenroll_result.stdout is regex('"client_secret"\s*:\s*".+"')
    fail_msg: >-
      The H2CK OIDC app could not re-enroll the Nextcloud MCP client.
      Verify the app is installed and the oidc:create command is supported.
  when:
    - nextcloud_mcp_backend == 'standalone'
    - not ia_nextcloud_mcp_oidc_client_found

- name: Save re-enrolled Nextcloud MCP OIDC credentials
  become: "{{ not local_safe }}"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ docker_volumes_path }}/secrets/{{ item.name }}"
    mode: '0600'
  no_log: true
  loop:
    - name: nextcloud_mcp_oidc_client_id
      content: "{{ (ia_nextcloud_mcp_oidc_reenroll_result.stdout | from_json).client_id }}"
    - name: nextcloud_mcp_oidc_client_secret
      content: "{{ (ia_nextcloud_mcp_oidc_reenroll_result.stdout | from_json).client_secret }}"
  when:
    - nextcloud_mcp_backend == 'standalone'
    - not ia_nextcloud_mcp_oidc_client_found

- name: Use re-enrolled Nextcloud MCP OIDC credentials
  ansible.builtin.set_fact:
    nextcloud_mcp_oidc_client_id: "{{ (ia_nextcloud_mcp_oidc_reenroll_result.stdout | from_json).client_id }}"
    nextcloud_mcp_oidc_client_secret: "{{ (ia_nextcloud_mcp_oidc_reenroll_result.stdout | from_json).client_secret }}"
  when:
    - nextcloud_mcp_backend == 'standalone'
    - not ia_nextcloud_mcp_oidc_client_found

- name: Retrieve or generate the Nextcloud MCP encryption seed
  ansible.builtin.include_tasks: "retrieve_password.yml"
  vars:
    secrets:
      - nextcloud_mcp_encryption_seed
  when: nextcloud_mcp_backend == 'standalone'

- name: Derive the Fernet token encryption key
  ansible.builtin.set_fact:
    ia_nextcloud_mcp_token_encryption_key: "{{ nextcloud_mcp_encryption_seed | b64encode }}"
  when: nextcloud_mcp_backend == 'standalone'

- name: Create persistent data directory for Nextcloud MCP
  become: "{{ not local_safe }}"
  ansible.builtin.file:
    path: "{{ docker_volumes_path }}/nextcloud-mcp-data"
    state: directory
    owner: "1000"
    group: "1000"
    mode: u=rwx,g=rx,o=
  when: nextcloud_mcp_backend == 'standalone'

- name: Create Speaches cache directory (ubuntu-owned)
  become: "{{ not local_safe }}"
  ansible.builtin.file:
    path: "{{ docker_volumes_path }}/speaches-hf-cache"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: u=rwx,g=o=rx

- name: Report detected IA GPU mode
  ansible.builtin.debug:
    msg: "IA GPU mode selected: effective={{ gpu_mode_effective | default('none') }}"

- name: Set Ollama embeddings GPU mode
  ansible.builtin.set_fact:
    embedding_gpu: >-
      {{
        'intel'
        if (gpu_intel_available | default(false) | bool)
        and (
          gpu_mode_effective | default('none') == 'intel'
          or ollama_embeddings_use_gpu | bool
        )
        else 'none'
      }}

- name: Compute Ollama NVIDIA tuning
  ansible.builtin.set_fact:
    ia_ollama_gpu_overhead_mb: >-
      {{
        [
          ollama_gpu_overhead_min_mb | int,
          [
            ((gpu_nvidia_vram_total_mb | int) * (ollama_gpu_overhead_ratio | float))
            | round(0, 'ceil') | int,
            ollama_gpu_overhead_max_mb | int
          ] | min
        ] | max
      }}
  when: gpu_mode_effective | default('none') == 'nvidia'

- name: Report Ollama NVIDIA memory reservation
  ansible.builtin.debug:
    msg: >-
      Based on {{ gpu_nvidia_vram_total_mb }} MiB GPU VRAM, Ollama will reserve
      {{ ia_ollama_gpu_overhead_mb }} MiB from available memory.
  when: gpu_mode_effective | default('none') == 'nvidia'

- name: Configure Authentik OAuth applications for IA
  # delegate_to: localhost
  become: false
  when: authentik_api_token is defined
  block:
    - name: Configure Authentik OAuth provider and application for IA WebUI
      when: authentik_api_token is defined
      ansible.builtin.include_tasks: "tasks/authentik_common.yml"
      vars:
        oauth_apps:
          - provider:
              name: "webui-oauth-provider"
              redirect_uris:
                - url: "https://ia.{{ app_domain_name }}/oauth/oidc/callback"
                  matching_mode: "strict"
              client_type: "confidential"
              sub_mode: "user_email"
              include_claims_in_id_token: true
              issuer_mode: "per_provider"
              access_code_validity: "minutes=1"
              access_token_validity: "minutes=10"
              refresh_token_validity: "days=30"
              scopes: "openid profile email"
            app:
              name: "WebUI"
              slug: "{{ webui_oauth_slug_name }}"
              open_in_new_tab: true
              meta_launch_url: "https://ia.{{ app_domain_name }}"
              meta_description: "AI WebUI for speech and language processing"
              meta_publisher: "IA Services"

    - name: Set WebUI OAuth credentials as facts
      when:
        - oauth_provider_client_id is defined
        - oauth_provider_client_secret is defined
        - current_oauth_provider_name == "webui-oauth-provider"
      ansible.builtin.set_fact:
        webui_oauth_client_id: "{{ oauth_provider_client_id }}"
        webui_oauth_client_secret: "{{ oauth_provider_client_secret }}"

    - name: Ensure secrets directory exists for Docker secret mounts
      become: true
      ansible.builtin.file:
        path: "{{ docker_volumes_path }}/secrets"
        state: directory
        mode: '0700'
      when:
        - webui_oauth_client_id is defined
        - webui_oauth_client_id | length > 0

    - name: Write OAuth client ID secret file
      become: true
      ansible.builtin.copy:
        content: "{{ webui_oauth_client_id }}"
        dest: "{{ docker_volumes_path }}/secrets/webui_oauth_client_id"
        mode: '0600'
      when:
        - webui_oauth_client_id is defined
        - webui_oauth_client_id | length > 0

    - name: Write OAuth client secret file
      become: true
      ansible.builtin.copy:
        content: "{{ webui_oauth_client_secret }}"
        dest: "{{ docker_volumes_path }}/secrets/webui_oauth_client_secret"
        mode: '0600'
      when:
        - webui_oauth_client_secret is defined
        - webui_oauth_client_secret | length > 0

- name: Create docker-compose stack file
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ stacks_base_path }}/ia/docker-compose.yml"
    mode: u=rwx,g=o=rx
  vars:
    gpu: "{{ gpu_mode_effective | default('none') }}"

- name: Create Speaches model aliases file
  ansible.builtin.template:
    src: speaches_model_aliases.json
    dest: "{{ stacks_base_path }}/ia/model_aliases.json"
    mode: u=rw,g=o=r

- name: Create override Dockerfile for ollama-metrics
  ansible.builtin.template:
    src: ollama-metrics.Dockerfile
    dest: "{{ stacks_base_path }}/ia/ollama-metrics.Dockerfile"
    mode: u=rwx,g=o=rx

- name: Create OpenWebUI API proxy config
  ansible.builtin.template:
    src: webui-api-proxy.conf
    dest: "{{ stacks_base_path }}/ia/webui-api-proxy.conf"
    mode: u=rw,g=o=r

- name: Deploy stack from a compose file
  community.docker.docker_compose_v2:
    pull: "always"
    build: "always"
    state: present
    project_src: "{{ stacks_base_path }}/ia"

- name: Wait for Ollama API tags endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/api/tags"
    method: GET
    status_code: 200
  register: ia_ollama_tags
  retries: 30
  delay: 2
  until: ia_ollama_tags.status == 200

- name: Wait for Ollama Embeddings API tags endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:8082/api/tags"
    method: GET
    status_code: 200
  register: ia_ollama_embeddings_tags
  retries: 30
  delay: 2
  until: ia_ollama_embeddings_tags.status == 200

- name: Compute required and installed Ollama model lists
  ansible.builtin.set_fact:
    ia_ollama_installed_models: "{{ (ia_ollama_tags.json.models | default([])) | map(attribute='name') | list }}"
    ia_ollama_embeddings_installed_models: >-
      {{ (ia_ollama_embeddings_tags.json.models | default([])) | map(attribute='name') | list }}
    ia_ollama_required_llm_models: >-
      {{
        [ia_ollama_agent_model]
        | select('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}
    ia_ollama_required_embedding_models: >-
      {{
        [ia_ollama_embedding_model]
        | select('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Pull missing Ollama LLM models for IA integrations
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/api/pull"
    method: POST
    body_format: json
    body:
      name: "{{ item }}"
      stream: false
    status_code:
      - 200
      - 404
      - 500
  register: ia_ollama_llm_pull_results
  loop: "{{ ia_ollama_required_llm_models | default([]) }}"
  when:
    - item is string
    - item | length > 0
    - item not in (ia_ollama_installed_models | default([]))

- name: Pull missing Ollama embedding models to embeddings instance
  ansible.builtin.uri:
    url: "http://127.0.0.1:8082/api/pull"
    method: POST
    body_format: json
    body:
      name: "{{ item }}"
      stream: false
    status_code:
      - 200
      - 404
      - 500
  register: ia_ollama_embeddings_pull_results
  loop: "{{ ia_ollama_required_embedding_models | default([]) }}"
  when:
    - item is string
    - item | length > 0
    - item not in (ia_ollama_embeddings_installed_models | default([]))

- name: Warn for unknown Ollama LLM model names
  ansible.builtin.debug:
    msg: >-
      Ollama LLM model '{{ item.item }}' could not be pulled to main instance.
      Status {{ item.status }}: {{ item.json.error | default('unknown error') }}.
      Check model name availability in your Ollama registry.
  loop: "{{ ia_ollama_llm_pull_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - (item.status | default(0) | int) in [404, 500]

- name: Warn for unknown Ollama embedding model names
  ansible.builtin.debug:
    msg: >-
      Ollama embedding model '{{ item.item }}' could not be pulled to embeddings instance (port 8082).
      Status {{ item.status }}: {{ item.json.error | default('unknown error') }}.
      Check model name availability in your Ollama registry.
      For multilingual E5, try fully-qualified tags like
      intfloat/multilingual-e5-small or intfloat/multilingual-e5-base.
  loop: "{{ ia_ollama_embeddings_pull_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - (item.status | default(0) | int) in [404, 500]

- name: Wait for Speaches API health
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/health"
    method: GET
    status_code: 200
  register: speaches_health_check
  retries: 30
  delay: 2
  until: speaches_health_check.status == 200

- name: Retrieve currently installed Speaches models
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/v1/models"
    method: GET
    status_code:
      - 200
      - 500
  register: speaches_local_models

- name: Warn when Speaches model listing fails
  when:
    - (speaches_local_models.status | int) != 200
  ansible.builtin.debug:
    msg: >-
      Speaches returned status {{ speaches_local_models.status }} on /v1/models.
      Continuing with empty installed-model list and attempting configured post-deploy downloads.

- name: Compute already installed Speaches model IDs
  ansible.builtin.set_fact:
    speaches_installed_model_ids: >-
      {{
        ((speaches_local_models.json.data | default([])) | map(attribute='id') | list)
        if ((speaches_local_models.status | int) == 200 and (speaches_local_models.json is defined))
        else []
      }}

- name: Download missing Speaches models via API
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/v1/models/{{ item | urlencode }}"
    method: POST
    status_code:
      - 200
      - 201
      - 202
      - 409
      - 404
      - 500
  register: speaches_model_download_results
  loop: "{{ speaches_postdeploy_models | default([]) }}"
  when:
    - item is string
    - item | length > 0
    - item not in (speaches_installed_model_ids | default([]))

- name: Warn for unknown Speaches model IDs
  ansible.builtin.debug:
    msg: >-
      Speaches model '{{ item.item }}' not found in registry (404) and was skipped.
      Use GET /v1/registry to pick a valid model_id for speaches_postdeploy_models.
  loop: "{{ speaches_model_download_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - (item.status | default(0) | int) == 404

- name: Warn for Speaches internal errors on model download
  ansible.builtin.debug:
    msg: >-
      Speaches returned 500 while downloading '{{ item.item }}'.
      Model was not installed by post-deploy step and was skipped.
      You can retry later, or temporarily set speaches_postdeploy_models to [] to unblock deployment.
  loop: "{{ speaches_model_download_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - (item.status | default(0) | int) == 500

