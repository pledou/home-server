#jinja2: lstrip_blocks: True, trim_blocks: True
services:

  webui:
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=traefik_backend
      - traefik.constraint-label=traefik_backend
      - traefik.http.routers.ia-https.rule=Host(`ia.{{ app_domain_name }}`)
      - traefik.http.routers.ia-https.entrypoints=https
      - traefik.http.routers.ia-https.tls=true
      - traefik.http.routers.ia-https.tls.certresolver=le
      - traefik.http.services.ia.loadbalancer.server.port=8080
    image: "{{ webui_image }}:{{ webui_version }}"
    # Dependencies for tools
    command: >
      bash -c "
        export OAUTH_CLIENT_ID=$(cat /run/secrets/webui_oauth_client_id) &&
        export OAUTH_CLIENT_SECRET=$(cat /run/secrets/webui_oauth_client_secret) &&
        pip install requests pydantic caldav icalendar &&
        exec bash start.sh
      "
    environment:
      OLLAMA_BASE_URL: http://ollama-metrics:8080

      # Generic OAuth
      OAUTH_PROVIDER_NAME: "authentik"
      OAUTH_SCOPES: "openid profile email"
      OPENID_PROVIDER_URL: "https://auth.{{ app_domain_name }}/application/o/{{ webui_oauth_slug_name }}/.well-known/openid-configuration"
      WEBUI_URL: "https://ia.{{ app_domain_name }}"
      ENABLE_OAUTH_SIGNUP: True
      ENABLE_LOGIN_FORM: False
      DEFAULT_LOCALE: "fr"
      DEFAULT_MODELS: "ministral-3"
      DEFAULT_USER_ROLE: "user"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: True

      AUDIO_OPENAI_API_BASE_URL: "http://speaches:8000/v1"
      AUDIO_OPENAI_API_KEY: "openai-api-key"
      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://speaches:8000/v1"
      AUDIO_TTS_OPENAI_API_KEY: "openai-api-key"
      AUDIO_TTS_MODEL: "{{ speaches_tts_model}}"
      AUDIO_TTS_VOICE: "{{ speaches_tts_voice}}"
      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://speaches:8000/v1"
      AUDIO_STT_OPENAI_API_KEY: "openai-api-key"
      AUDIO_STT_MODEL: "{{ speaches_stt_model }}"
      ENABLE_ADMIN_EXPORT: False
      {% if ia_openai_api_key is defined and ia_openai_api_key != "" %}
      OPENAI_API_BASE_URLS: "{{ ia_openai_api_url }}"
      OPENAI_API_KEYS: "{{ ia_openai_api_key }}"
      {% endif %}

      # Vector Database for RAG
      VECTOR_DB: "chroma"
      CHROMA_HTTP_HOST: "chromadb"
      CHROMA_HTTP_PORT: "8000"
      
      # RAG Embeddings (separate ollama instance)
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_OLLAMA_BASE_URL: "http://ollama-embeddings-metrics:8082"
      RAG_EMBEDDING_MODEL: "{{ ia_ollama_embedding_model }}"
    restart: always
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - network
      - traefik_backend
    secrets:
      - webui_oauth_client_id
      - webui_oauth_client_secret
    depends_on:
     - ollama
     - ollama-embeddings
     - speaches
     - chromadb

  webui-api-proxy:
    labels:
      - com.centurylinklabs.watchtower.enable=true
    image: nginx:alpine
    depends_on:
      - webui
      - speaches
    restart: always
    networks:
      network:
        aliases:
          - webui-api-proxy
    volumes:
      - ./webui-api-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  ollama:
    labels:
      - com.centurylinklabs.watchtower.enable=true
    {% if gpu == 'intel' %}
    user: root
    {% endif %}
    image: "{% if gpu == 'intel' %}{{ ollama_intel_image }}:{{ ollama_intel_version }}{% else %}{{ ollama_image }}:{{ ollama_version }}{% endif %}"
    {% if gpu != 'intel' %}
    healthcheck:
      test: ollama --version || exit 1
    command: serve
    {% else %}
    command: ["bash", "-c", "source ipex-llm-init --gpu --device iGPU && bash start-ollama.sh"]
    {% endif %}
    pull_policy: always
    tty: true
    restart: always
    cpus: "{{ ollama_cpu_limit }}"
    mem_limit: "{{ ollama_memory_limit_mb }}m"
    shm_size: "{{ ollama_shm_size_mb }}m"
    environment:
      {% if gpu == 'intel' %}
      - DEVICE=iGPU
      {% endif %}
      - OLLAMA_KEEP_ALIVE={{ '24h' if gpu == 'none' else '2h' }}
      - OLLAMA_NUM_THREADS={{ ollama_num_threads }}
      - OLLAMA_HOST=0.0.0.0
      {% if gpu == 'intel' %}
      - no_proxy=localhost,127.0.0.1
      - OLLAMA_NUM_GPU=999
      - ZES_ENABLE_SYSMAN=1
      - SYCL_CACHE_PERSISTENT=1
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      {% endif %}
    {% if gpu == 'intel' %}
    working_dir: /llm/scripts/
    {% endif %}
    volumes:
      - ollama:/root/.ollama
    {% if gpu == 'intel' %}
    devices:
      - /dev/dri:/dev/dri
    {% endif %}
    networks:
      network:
        aliases:
          - ollama
    {% if gpu == 'nvidia' or gpu == 'intel' %}
    deploy:
      resources:
        reservations:
          devices:
            - driver: {{ 'intel' if gpu == 'intel' else 'nvidia' }}
              capabilities: [gpu]
    {% endif %}

  ollama-metrics:
    labels:
      - com.centurylinklabs.watchtower.enable=false
    build:
      context: .
      dockerfile: ./ollama-metrics.Dockerfile
    image: "{{ ollama_metrics_image }}:{{ ollama_metrics_version }}"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PORT=8080
    depends_on:
      - ollama
    expose:
      - 8080/tcp
    ports:
      - 8080:8080/tcp
    restart: unless-stopped
    networks:
      network:
        aliases:
          - ollama-metrics
      monitoring_backend:
        aliases:
          - ollama-metrics

  ollama-embeddings:
    labels:
      - com.centurylinklabs.watchtower.enable=true
    {% if not ollama_embeddings_use_gpu and gpu != 'intel' %}
    image: "{{ ollama_embeddings_image }}:{{ ollama_embeddings_version }}"
    command: serve
    {% else %}
    user: root
    image: "{{ ollama_embeddings_intel_image }}:{{ ollama_embeddings_intel_version }}"
    working_dir: /llm/scripts/
    command: ["bash", "-c", "source ipex-llm-init --gpu --device iGPU && bash start-ollama.sh"]
    devices:
      - /dev/dri:/dev/dri
    {% endif %}
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_THREADS={{ ollama_embeddings_num_threads }}
      - OLLAMA_HOST=0.0.0.0
      {% if ollama_embeddings_use_gpu or gpu == 'intel' %}
      - DEVICE=iGPU
      - no_proxy=localhost,127.0.0.1
      - OLLAMA_NUM_GPU=999
      - ZES_ENABLE_SYSMAN=1
      - SYCL_CACHE_PERSISTENT=1
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      {% endif %}
    networks:
      network:
        aliases:
          - ollama-embeddings
    volumes:
      - ollama-embeddings:/root/.ollama
    cpus: "{{ ollama_embeddings_cpu_limit }}"
    mem_limit: "{{ ollama_embeddings_memory_limit_mb }}m"
    shm_size: "{{ ollama_embeddings_shm_size_mb }}m"
    {% if gpu == 'nvidia' or ollama_embeddings_use_gpu or gpu == 'intel' %}
    deploy:
      resources:
        reservations:
          devices:
            - driver: {{ 'nvidia' if gpu == 'nvidia' else 'intel' }}
              capabilities: [gpu]
    {% endif %}
    healthcheck:
      test: ollama --version || exit 1

  ollama-embeddings-metrics:
    labels:
      - com.centurylinklabs.watchtower.enable=false
    build:
      context: .
      dockerfile: ./ollama-metrics.Dockerfile
    image: "{{ ollama_embeddings_metrics_image }}:{{ ollama_embeddings_metrics_version }}"
    environment:
      - OLLAMA_HOST=http://ollama-embeddings:11434
      - PORT=8082
    depends_on:
      - ollama-embeddings
    expose:
      - 8082/tcp
    ports:
      - 8082:8082/tcp
    restart: unless-stopped
    networks:
      network:
        aliases:
          - ollama-embeddings-metrics
      monitoring_backend:
        aliases:
          - ollama-embeddings-metrics

  speaches:
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=traefik_backend
      - traefik.constraint-label=traefik_backend
      - traefik.http.routers.ia-audio-https.rule=Host(`ia.{{ app_domain_name }}`) && PathPrefix(`/v1/audio`)
      - traefik.http.routers.ia-audio-https.priority=100
      - traefik.http.routers.ia-audio-https.entrypoints=https
      - traefik.http.routers.ia-audio-https.tls=true
      - traefik.http.routers.ia-audio-https.tls.certresolver=le
      - traefik.http.services.ia-audio.loadbalancer.server.port=8000
    image: "{{ speaches_image }}:{{ speaches_cuda_version if gpu == 'nvidia' else speaches_cpu_version }}"
    pull_policy: always
    environment:
      - PRELOAD_MODELS={{ speaches_preload_models | to_json }}
    networks:
      network:
        aliases:
          - speaches
      traefik_backend:
    ports:
      - 8000:8000
    volumes:
      - speaches-hf-cache:/home/ubuntu/.cache/huggingface/hub
      - ./model_aliases.json:/home/ubuntu/speaches/model_aliases.json:ro
    restart: unless-stopped
    {% if gpu == 'nvidia' %}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0', '1'] # Select a gpu, or use 'all' to use all available gpus
              capabilities: [gpu]
    {% endif %}

  chromadb:
    labels:
      - com.centurylinklabs.watchtower.enable=true
    image: "{{ chromadb_image }}:{{ chromadb_version }}"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb:/chroma/chroma
    ports:
      - 8001:8000
    restart: unless-stopped
    networks:
      network:
        aliases:
          - chromadb

  mindroom:
    container_name: mindroom
    volumes:
      - "{{ docker_volumes_path }}/mindroom-config/config.yaml:/app/config.yaml"
      - mindroom-data:/app/mindroom_data
      - mindroom-logs:/app/logs
    environment:
      - MATRIX_HOMESERVER=http://synapse:8008
      - MATRIX_SERVER_NAME=m.{{ app_domain_name }}
    depends_on:
      synapse:
        condition: service_healthy
    networks:
      - network
      - traefik_backend
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      # Dashboard routes go directly to the MindRoom runtime, which now serves the bundled UI
      - traefik.docker.network=traefik_backend
      - traefik.http.routers.mindroom-https.rule=Host(`mindroom.{{ app_domain_name }}`)
      - traefik.http.routers.mindroom-https.entrypoints=https
      - traefik.http.routers.mindroom-https.tls=true
      - traefik.http.routers.mindroom-https.tls.certresolver=le
      - traefik.http.routers.mindroom-https.priority=50
      - traefik.http.routers.mindroom-https.middlewares=authentik@docker
      - traefik.http.routers.mindroom-https.service=mindroom
      - traefik.http.services.mindroom.loadbalancer.server.port=8765

      # OpenAI-compatible /v1 routes go directly to the MindRoom runtime (has its own auth)
      - traefik.http.routers.mindroom-v1.rule=Host(`mindroom.{{ app_domain_name }}`) && PathPrefix(`/v1`)
      - traefik.http.routers.mindroom-v1.entrypoints=https
      - traefik.http.routers.mindroom-v1.tls=true
      - traefik.http.routers.mindroom-v1.tls.certresolver=le
      - traefik.http.routers.mindroom-v1.service=mindroom-v1
      - traefik.http.routers.mindroom-v1.priority=100
      - traefik.http.services.mindroom-v1.loadbalancer.server.port=8765

    image: "{{ mindroom_image }}:{{ mindroom_version }}"

  mindroom-chat:
    image: ghcr.io/mindroom-ai/mindroom-chat:latest
    environment:
      - CLIENT_HOMESERVER_URL=https://m.{{ app_domain_name }}
      - MINDROOM_DASHBOARD_URL=https://mindroom.{{ app_domain_name }}
      - APP_BASE_PATH=/
      - APP_ENABLE_SERVICE_WORKER=true
    volumes:
      - "{{ docker_volumes_path }}/mindroom-config/client-config.json:/app/config.template.json:ro"
    command: >
      sh -c "envsubst < /app/config.template.json > /app/config.json && exec nginx -g 'daemon off;'"
    depends_on:
      synapse:
        condition: service_healthy
      mindroom:
        condition: service_started
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.http.routers.mindroom-chat.rule=Host(`chat.{{ app_domain_name }}`)
      - traefik.http.routers.mindroom-chat.entrypoints=https
      - traefik.http.routers.mindroom-chat.tls=true
      - traefik.http.routers.mindroom-chat.tls.certresolver=le
      - traefik.http.routers.mindroom-chat.services=mindroom-chat
      - traefik.http.services.mindroom-chat.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/config.json"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sandbox-runner:
    image:  "{{ mindroom_image }}:{{ mindroom_version }}"
    container_name: mindroom-sandbox-runner
    restart: always
    user: 1000:1000
    command: ["/app/run-sandbox-runner.sh"]
    volumes:
      - mindroom-sandbox-workspace:/app/workspace
    environment:
      - MINDROOM_SANDBOX_RUNNER_MODE=true
      - MINDROOM_SANDBOX_PROXY_TOKEN=${MINDROOM_SANDBOX_PROXY_TOKEN:-sandbox-secret}
      - MINDROOM_CONFIG_PATH=/app/config.yaml
      - MINDROOM_STORAGE_PATH=/app/workspace/.mindroom
    networks:
      - network
  synapse:
    image: "{{ synapse_image }}:{{ synapse_version }}"
    container_name: synapse
    environment:
      SYNAPSE_SERVER_NAME: m.{{ app_domain_name }}
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_DATABASE_URL: postgresql://synapse:{{ synapse_postgres_password }}@synapse-postgres:5432/synapse
      SYNAPSE_REDIS_URL: redis://synapse-redis:6379
    depends_on:
      synapse-postgres:
        condition: service_healthy
      synapse-redis:
        condition: service_healthy
    extra_hosts:
      - "{{ app_domain_name }}:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - synapse-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - network
      - traefik_backend
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=traefik_backend
      - traefik.http.routers.synapse-matrix.rule=Host(`m.{{ app_domain_name }}`)
      - traefik.http.routers.synapse-matrix.entrypoints=https
      - traefik.http.routers.synapse-matrix.tls=true
      - traefik.http.routers.synapse-matrix.tls.certresolver=le
      - traefik.http.routers.synapse-matrix.service=synapse-matrix
      - traefik.http.services.synapse-matrix.loadbalancer.server.port=8008
      - traefik.http.routers.synapse-fed.rule=Host(`matrix-federation.{{ app_domain_name }}`)
      - traefik.http.routers.synapse-fed.entrypoints=https
      - traefik.http.routers.synapse-fed.tls=true
      - traefik.http.routers.synapse-fed.tls.certresolver=le
      - traefik.http.routers.synapse-fed.service=synapse-fed
      - traefik.http.services.synapse-fed.loadbalancer.server.port=8080

  synapse-postgres:
    labels:
      - com.centurylinklabs.watchtower.enable=true
    image: "{{ synapse_postgres_image }}:{{ synapse_postgres_version | default('15') }}"
    container_name: synapse-postgres
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/synapse_postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - synapse-postgres-data:/var/lib/postgresql/data
    secrets:
      - synapse_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      network:
        aliases:
          - synapse-postgres
    restart: always

  synapse-redis:
    image: redis:7-alpine
    container_name: synapse-redis
    volumes:
      - synapse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      network:
        aliases:
          - synapse-redis
    restart: always

volumes:
  ollama:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/ollama"
  ollama-embeddings:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/ollama-embeddings"
  open-webui:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/open-webui"
  speaches-hf-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/speaches-hf-cache"
  chromadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/chromadb"

  synapse-postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/synapse-postgres-data"
  synapse-redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/synapse-redis-data"
  synapse-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/synapse-data"
  mindroom-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/mindroom-data"
  mindroom-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/mindroom-logs"
  mindroom-sandbox-workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ docker_volumes_path }}/mindroom-sandbox-workspace"

networks:
  network:
  traefik_backend:
    external: true
  monitoring_backend:
    external: true

secrets:
  webui_oauth_client_id:
    file: "{{ docker_volumes_path }}/secrets/webui_oauth_client_id"
  webui_oauth_client_secret:
    file: "{{ docker_volumes_path }}/secrets/webui_oauth_client_secret"
  synapse_postgres_password:
    file: "{{ docker_volumes_path }}/secrets/synapse_postgres_password"